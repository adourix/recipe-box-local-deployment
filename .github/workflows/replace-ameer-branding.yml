name: Replace old recipe branding

on:
  push:
    branches: [local-deployment]

permissions:
  contents: write

jobs:
  replace:
    if: contains(github.event.head_commit.message, 'replace old recipe branding') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old branding everywhere
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            if grep -Iq . "$file" && grep -q 'أمير' "$file"; then
              sed -i 's/أمير/عياد/g' "$file"
              found=1
            fi
          done < <(git ls-files -z)

          if [ "$found" -eq 1 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'chore: replace old recipe branding'
            git push
          else
            echo 'No old branding found.'
          fi
